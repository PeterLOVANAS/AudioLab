name: Release checks
on:
  pull_request:
  push:
    branches: [main, worker, feat/task-builder-integration, 'release/**']
  workflow_dispatch:

# Untrusted PRs execute without repository secrets or write permissions.
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/requirements.txt
      - run: pnpm run docs:check
      - run: pnpm run typecheck
      - run: pnpm run test:regressions
      - run: pnpm run test:python
      - run: pnpm run build
      - run: pnpm run test:production
        env:
          AUDIOLAB_TEST_PYTHON: python
      - run: node scripts/test_production_config.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/requirements.txt
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm run test:acceptance
        env:
          AUDIOLAB_BROWSER_CHANNEL: chromium
    # Do not upload the temporary root: it contains passwords, cookies and D1/R2.
    # No deployment job, cloud credentials, OIDC token or artifact publication.
